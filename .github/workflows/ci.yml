name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The manifest's `fliks` range is checked against the core release this plugin targets.
      # Failing to resolve it fails the job: a green run on a guessed version publishes an archive
      # that a real core refuses.
      - name: Resolve the core version to check the manifest against
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(gh release view --repo fliks-app/fliks --json tagName -q .tagName | sed 's/^v//')
          [ -n "$v" ] || { echo "::error::could not resolve the latest fliks release"; exit 1; }
          echo "FLIKS_CORE_VERSION=$v" >> "$GITHUB_ENV"
          echo "checking the manifest against fliks $v"
      - run: npm test
      - run: npm run build
      - run: node --check dist/plugin.js

  package:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package
        env:
          FK_NOTIFY_SIGNING_KEY: ${{ secrets.FK_NOTIFY_SIGNING_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: fliks-notify.fkplugin
          path: dist/fliks-notify.fkplugin
