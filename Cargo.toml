[workspace]
resolver = "3"
members = [".", "xtask"]
default-members = ["."]

[package]
name = "fk-plugin-notify"
version = "2.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fliks-plugin-sdk = { git = "https://github.com/fliks-app/fliks", rev = "866c6107ec411450a5dfaf0319f5c7b34ccf3fb5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
fliks-plugin-sdk = { git = "https://github.com/fliks-app/fliks", rev = "866c6107ec411450a5dfaf0319f5c7b34ccf3fb5", features = ["harness"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Optimised deps: an unoptimised Cranelift makes every wasm compile in the harness tests minutes long.
[profile.dev.package."*"]
opt-level = 1
